<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarveyChatApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: #2c343f;
            --active-blue: #5d68e2;
            --bg-light: #f4f7fe;
            --text-gray: #8e94a9;
            --border-color: #e0e0e0;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100dvh; background: var(--bg-light); overflow: hidden; position: fixed; width: 100%; }
        
        /* Main Sidebar */
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; font-weight: bold; letter-spacing: 1px; border-bottom: 1px solid #3d4654; }
        
        .user-profile { padding: 20px; display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; background: #555; }
        .user-info strong { display: block; font-size: 14px; }
        .user-info small { color: var(--text-gray); font-size: 12px; }
        
        .menu-item { padding: 12px 25px; color: var(--text-gray); cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .menu-item:hover { color: white; }
        .menu-item.active { background: var(--active-blue); color: white; border-radius: 0 20px 20px 0; margin-right: 20px; }

        /* Chat Layout Container */
        .chat-container { flex: 1; display: grid; grid-template-columns: 350px 1fr; background: white; }
        
        /* Conversation List (Left Panel) */
        .conv-list { border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .conv-header { padding: 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .active-user-item { padding: 15px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9f9f9; }
        .active-user-item:hover { background: #f0f4ff; }
        .active-user-item img { width: 35px; height: 35px; border-radius: 50%; }

        /* Main Chat Area (Right Panel) */
       .main-chat { 
    display: flex; 
    flex-direction: column; 
    background: white; 
    height: 100dvh; 
    overflow: hidden; 
    position: relative;
}
        .chat-header { padding: 15px 25px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        
        .messages { 
    flex: 1; 
    padding: 20px; 
    overflow-y: auto; /* Enables scrolling for messages only */
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
    background: #fafbfc; 
    scroll-behavior: smooth; 
}
        .message { max-width: 65%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; }
        .msg-received { background: var(--active-blue); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-sent { background: #e9ecef; color: #333; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-author { font-size: 10px; margin-bottom: 4px; display: block; opacity: 0.8; }

        .input-area { 
    padding: 10px 15px; 
    border-top: 1px solid var(--border-color); 
    display: flex; 
    gap: 10px; 
    background: white; 
    flex-shrink: 0; 
    padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
}
        input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--active-blue); }
        .send-btn { background: var(--active-blue); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .msg-time {
    display: block;
    font-size: 10px;
    margin-top: 4px;
    color: inherit; 
    opacity: 0.7;
}

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    #menu-toggle { display: block !important; }

    .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100dvh;
        z-index: 1001; 
        transition: 0.3s ease-in-out;
    }
    #users-toggle { display: block !important; }

    .sidebar.active { left: 0; }

    .chat-container {
        grid-template-columns: 1fr;
        height: 100dvh;
    }

    .conv-list {
        position: absolute;
        left: -100%; /* Hidden off-screen to the left */
        top: 0;
        width: 80%; /* Takes up most of the screen */
        height: 100%;
        background: white;
        z-index: 1000;
        transition: 0.3s ease-in-out;
        box-shadow: 5px 0 15px rgba(0,0,0,0.1);
        display: flex; /* Override the hide */
    }

    /* When this class is added via JS, it slides in */
    .conv-list.show-mobile {
        left: 0;
    }

    /* Dark mode support for the sliding panel */
    body.dark-mode .conv-list {
        background: #1a1d23;
        border-right: 1px solid #2d323c;
    }
    
    .message { max-width: 85%; }

    /* Fix for the emoji picker on small screens */
    .emoji-picker {
        width: 80%;
        left: 10%;
        bottom: 70px;
    }
}

/* Emoji Picker styling */
.emoji-picker {
    display: none;
    position: absolute;
    bottom: 80px;
    left: 20px;
    background: white;
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    z-index: 1000;
}
.emoji-picker span { cursor: pointer; font-size: 20px; transition: 0.2s; }
.emoji-picker span:hover { transform: scale(1.2); }

/* Image message styling */
.chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }

.online-pulse {
    width: 10px;
    height: 10px;
    background: #28a745;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
    box-shadow: 0 0 0 rgba(40, 167, 69, 0.4);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
}

/* Makes sure avatars don't look stretched or weird while loading */
.message img {
    background-color: #eee;
    min-width: 28px;
    min-height: 28px;
}

.notification-badge {
    background-color: #ff4d4d;
    color: white;
    font-size: 10px; /* Slightly smaller for better fit */
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 50%; /* Pure circle for single digits */
    display: none; /* Hidden by default until a message arrives */
    align-items: center;
    justify-content: center;
    padding: 2px;
    margin-left: auto; /* Pushes the badge to the far right of the user item */
    box-shadow: 0 2px 4px rgba(255, 77, 77, 0.3);
    border: 1.5px solid var(--bg-side); /* Creates a gap between badge and background */
    line-height: 1;
}

/* If the badge has more than one digit, make it an oval instead of a circle */
.notification-badge:not(:empty) {
    padding: 0 6px;
    border-radius: 10px;
}

/* Dark Mode Colors */
body.dark-mode {
    --sidebar-bg: #1a1d23;
    --bg-light: #121418;
    --border-color: #2d323c;
    --text-gray: #a0a6b5;
}

/* UI Overrides */
body.dark-mode .chat-container,
body.dark-mode .main-chat,
body.dark-mode .input-area,
body.dark-mode .conv-header,
body.dark-mode .conv-list { background-color: #1a1d23; color: #e0e6ed; }

body.dark-mode .messages { background-color: #121418; }
body.dark-mode input { background: #242933; border-color: #3d4654; color: white; }
body.dark-mode .msg-sent { background: #2d323c; color: #e0e6ed; }
body.dark-mode .active-user-item:hover { background: #2d323c; }

/* Transitions */
body, .sidebar, .main-chat, .messages, .input-area {
    transition: background-color 0.3s ease, color 0.3s ease;
}

/* Mobile Close Button Style */
.mobile-close-btn { 
    display: none; 
    background: none; 
    border: none; 
    font-size: 20px; 
    cursor: pointer; 
    color: var(--text-gray); 
}

@media (max-width: 768px) {
    .mobile-close-btn { display: block !important; }
    /* Ensure user list stays on top of everything when sliding out */
    .conv-list { z-index: 1002; } 
}
    </style>
</head>

<body>

    <div class="sidebar"> <div class="sidebar-header">HarveyChatApp</div>
        <div class="user-profile">
            <div style="position: relative; width: 45px; height: 45px; flex-shrink: 0;">
                <img id="myAvatar" src="" alt="profile" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--active-blue);">
                <i class="fas fa-camera" onclick="document.getElementById('profileInput').click()" 
                   style="position: absolute; bottom: -2px; right: -2px; background: var(--active-blue); color: white; font-size: 10px; padding: 4px; border-radius: 50%; cursor: pointer; border: 2px solid var(--sidebar-bg);"></i>
            </div>
            <input type="file" id="profileInput" accept="image/*" style="display:none" onchange="changeProfilePic(this)">

    <div>

    </div>
    <i id="theme-icon" class="fas fa-moon" 
       style="cursor: pointer; font-size: 14px; color: #fff; padding: 5px; transition: color 0.3s ease;"

</div>
        </div>

        <div class="menu-item"><i class="fas fa-th-large"></i> Dashboard</div>

        </button>

            <div id="user-list">
                <div class="active-user-item">

       <div class="main-chat">
    <div class="chat-header">
    <div style="display: flex; align-items: center; gap: 15px;">

</div>
        <div style="color: var(--text-gray); font-size: 18px;">

<i class="fas fa-phone" style="margin-right:15px; cursor:pointer;"></i>

    <script>
       function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('active');
    overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
} 

function toggleEmojiPicker() {
    const picker = document.getElementById('emoji-picker');
    picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
}

function addEmoji(emoji) {
    const input = document.getElementById('msgInput');
    input.value += emoji;
    input.focus();
    toggleEmojiPicker();
}

function sendImage(input) {
    if (input.files && input.files[0]) {
        document.getElementById("sendSound").play(); // Play sound
        const reader = new FileReader();
        reader.onload = function(e) {
            const messageData = {
                type: "message",
                user: currentUsername,
                target: currentChatTarget,
                body: e.target.result, 
                is_image: true,
                user_avatar: getCurrentAvatar(currentUsername) // Send avatar with image too!
            };
            socket.send(JSON.stringify(messageData));
        };
        reader.readAsDataURL(input.files[0]);
        input.value = ""; 
    }
}

        let currentChatTarget = "Global"; // Default to the main room

        const getCookie = (name) => {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return "Guest";
        }

        const currentUsername = getCookie("username");

// If no username is found, or it's "Guest", redirect to login immediately
if (!currentUsername || currentUsername === "Guest") {
    window.location.href = "/";
}

document.getElementById("myName").innerText = currentUsername;
document.getElementById("myAvatar").src = getCurrentAvatar(currentUsername);

        // 2. WEBSOCKET LOGIC
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
let socket = new WebSocket(protocol + window.location.host + "/ws");

  socket.onmessage = function(event) {
    const data = JSON.parse(event.data);
    const chatBox = document.getElementById("chat-box");
    const typingDiv = document.getElementById("typing-indicator");

    if (data.type === "users") {
        // --- PROFILE SYNC LOGIC ---
        // Find YOUR profile in the list sent by the server
        const myProfile = data.user_info_list.find(u => u.username === currentUsername);
        
        if (myProfile && myProfile.avatar) {
            // Update your sidebar avatar immediately from the DB
            document.getElementById("myAvatar").src = myProfile.avatar;
            // Update localStorage so it persists even if the socket drops
            localStorage.setItem("userAvatar_" + currentUsername, myProfile.avatar);
        }

        // We pass the whole 'data' object because it now contains 'user_info_list'
        updateUserList(data);
    }
    // 1. Handle Typing Indicator
    else if (data.type === "typing" && data.user !== currentUsername) {
        typingDiv.innerText = `${data.user} is typing...`;
    } 
    else if (data.type === "stop_typing") {
        typingDiv.innerText = "";
    }
    // 2. Handle Deletion
    else if (data.type === "message_deleted") {
        const el = document.querySelector(`[data-id="${data.id}"]`);
        if (el) {
            document.getElementById("deleteSound").play();
            el.style.opacity = "0";
            setTimeout(() => el.remove(), 300);
        }
    } 
    // 3. Handle Messages
    else if (data.type === "message") {
        const isGlobal = data.target === "Global" || !data.target;
        const isRelevant = (isGlobal && currentChatTarget === "Global") || 
                           (data.user === currentChatTarget && data.target === currentUsername) || 
                           (data.user === currentUsername && data.target === currentChatTarget);

        if (isRelevant) {
            let msgDiv = document.createElement("div");
            const isMe = data.user === currentUsername;
            
            if (!isMe) document.getElementById("receiveSound").play();

            msgDiv.setAttribute("data-id", data.id);
            msgDiv.className = isMe ? "message msg-sent" : "message msg-received";
            
            const deleteBtn = isMe ? 
                `<i class="fas fa-trash-alt" style="cursor:pointer; margin-left:8px; color:#ff4d4d; font-size:12px;" onclick="confirmDelete(${data.id})"></i>` : '';

            const checkMark = isMe ? `<i class="fas fa-check-double" style="margin-left:5px; color:#5d68e2;"></i>` : '';

            // --- AVATAR LOGIC FOR MESSAGES ---
            const avatarSrc = data.user_avatar || `https://ui-avatars.com/api/?name=${data.user}&background=random`;
            
            if (data.user_avatar) {
                localStorage.setItem(`avatar_${data.user}`, data.user_avatar);
            }

            msgDiv.innerHTML = `
                <div style="display: flex; gap: 10px; align-items: flex-start; flex-direction: ${isMe ? 'row-reverse' : 'row'}">
                    <img src="${avatarSrc}" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #eee; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1);">
                    <div style="display: flex; flex-direction: column; align-items: ${isMe ? 'flex-end' : 'flex-start'}; max-width: 100%;">
                        <span class="msg-author" style="margin-bottom: 2px;">${isMe ? "You" : data.user}</span>
                        
                        ${data.is_image ? 
                            `<img src="${data.body}" class="chat-img" style="border-radius: 8px; max-width: 100%; cursor: pointer;" onclick="window.open(this.src)">` : 
                            `<div class="msg-body" style="word-break: break-word;">${data.body}</div>`
                        }

                        <div style="display: flex; align-items: center; font-size: 10px; opacity: 0.6; margin-top: 4px;">
                            ${data.time}
                            ${checkMark}
                            ${deleteBtn}
                        </div>
                    </div>
                </div>
            `;

            chatBox.appendChild(msgDiv);
            const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 100;
            if (isScrolledToBottom || isMe) {
                chatBox.scrollTo({
                    top: chatBox.scrollHeight,
                    behavior: 'smooth'
                });
            }
        }

        // --- NOTIFICATION BADGE LOGIC ---
        if (data.target !== "Global" && data.target && data.user !== currentUsername) {
            if (currentChatTarget !== data.user) {
                incrementUnread(data.user);
            }
        }
    }
};

       function updateUserList(eventData) {
    const listDiv = document.getElementById("user-list");
    listDiv.innerHTML = "";
    
    // 1. Always add the Global Group first
    const globalItem = document.createElement("div");
    globalItem.className = "active-user-item";
    globalItem.innerHTML = `
        <img src="https://ui-avatars.com/api/?name=Global+Chat&background=5d68e2&color=fff" alt="">
        <div><strong>Global Chat Room</strong><br><small style="color:var(--text-gray)">Active now</small></div>
    `;
    globalItem.onclick = () => switchChat("Global");
    listDiv.appendChild(globalItem);

    // 2. Get the list of info objects from the server event
    const userInfos = eventData.user_info_list || [];

    userInfos.forEach(info => {
        if (info.username === currentUsername) return; // Don't chat with yourself

        // Save the avatar the server sent into localStorage so it's cached
        if (info.avatar) {
            localStorage.setItem(`avatar_${info.username}`, info.avatar);
        }

        // Determine which image to show: 
        // 1. The one the server just sent
        // 2. OR the one we already have in localStorage
        // 3. OR the default UI-Avatar
        const displayAvatar = info.avatar || getCurrentAvatar(info.username);
        const unreadCount = getUnreadCount(info.username);

        const userItem = document.createElement("div");
        userItem.className = "active-user-item";
        userItem.innerHTML = `
    <img src="${displayAvatar}" alt="${info.username}">
    <div style="flex-grow: 1;">
        <strong>${info.username}</strong><br>
        <small style="color:#28a745"><span class="online-pulse"></span>Active Now</small>
    </div>
    <span id="badge-${info.username}" class="notification-badge" style="${unreadCount > 0 ? 'display:block' : 'display:none'}">
        ${unreadCount}
    </span>
`;
        userItem.onclick = () => switchChat(info.username);
        listDiv.appendChild(userItem);
    });
}

function switchChat(target) {
    currentChatTarget = target;
    clearUnread(target);
    document.getElementById("chat-title").innerText = (target === "Global") ? "Global Chat Room" : "Chat with " + target;
    document.getElementById("chat-box").innerHTML = ""; 
    
    // Highlight the active user in the list
    document.querySelectorAll('.active-user-item').forEach(el => el.classList.remove('active-chat'));
    
    // --- MOBILE FIX: Close the user list drawer after selecting someone ---
    if (window.innerWidth <= 768) {
        const convList = document.querySelector('.conv-list');
        if (convList) convList.classList.remove('show-mobile');
        
        const overlay = document.getElementById('sidebar-overlay');
        if (overlay) overlay.style.display = 'none';
    }

    // Ask server for specific history
    socket.send(JSON.stringify({ type: "load_history", target: target }));
}

      function sendMessage() {
    let input = document.getElementById("msgInput");
    if(input.value.trim() !== "") {
        // Play the "Send" sound effect immediately
        document.getElementById("sendSound").play(); 

        const messageData = {
            type: "message",
            user: currentUsername, // Explicitly send username
            target: currentChatTarget, 
            body: input.value,
            // We add the avatar here so others can see it
            user_avatar: getCurrentAvatar(currentUsername) 
        };

        socket.send(JSON.stringify(messageData));
        input.value = "";
        
        // Also send a "stop_typing" signal immediately after sending
        socket.send(JSON.stringify({ 
            type: "stop_typing", 
            user: currentUsername, 
            target: currentChatTarget 
        }));
    }
}

// Typing Indicator Logic
    let typingTimeout;
    document.getElementById("msgInput").addEventListener("input", () => {
        // Send typing signal to server
        socket.send(JSON.stringify({ 
            type: "typing", 
            user: currentUsername, 
            target: currentChatTarget 
        }));
        
        // Stop the "typing" status after 2 seconds of no input
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.send(JSON.stringify({ 
                type: "stop_typing", 
                user: currentUsername, 
                target: currentChatTarget 
            }));
        }, 2000);
    });

      function logout() {
    // This calls the new /logout route we added to main.go
    // It is more secure because the server handles the cookie destruction
    window.location.href = "/logout";

    // Optional: Clear local storage so the next user doesn't see your 
    // old chat theme or cached avatars
    localStorage.clear();
}

       // --- Helper function to send delete request to Go server ---
function confirmDelete(messageId) {
    if (confirm("Permanently delete this message?")) {
        socket.send(JSON.stringify({
            type: "delete_message",
            id: parseInt(messageId)
        }));
    }
}

function clearHistory() {
    if (confirm(`Are you sure you want to clear all messages with ${currentChatTarget}?`)) {
        socket.send(JSON.stringify({
            type: "clear_history",
            target: currentChatTarget
        }));
        document.getElementById("chat-box").innerHTML = ""; // Clear screen immediately
    }
}

// Function to change and save profile pic
function changeProfilePic(input) {
    if (input.files && input.files[0]) {
        // Optional: Check file size (Base64 images can get very large)
        if (input.files[0].size > 1024 * 1024) { // 1MB limit
            alert("Image is too big! Please choose a file under 1MB.");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const imageData = e.target.result;
            
            // 1. Update own UI immediately so it feels fast
            document.getElementById("myAvatar").src = imageData;
            
            // 2. Save to browser storage (for instant loading on refresh)
            localStorage.setItem("userAvatar_" + currentUsername, imageData);

            // 3. SEND TO SERVER (This makes it stay even after Logout)
            // This triggers the "update_avatar" block we added in main.go
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "update_avatar",
                    user: currentUsername,
                    body: imageData
                }));
            }
        };
        reader.readAsDataURL(input.files[0]);
    }
}

// Function to get the current avatar (either saved one or default)
function getCurrentAvatar(username) {
    const saved = localStorage.getItem("userAvatar_" + username);
    if (saved) return saved;
    return `https://ui-avatars.com/api/?name=${username}&background=random`;
}

// Object to keep track of unread counts
let unreadMessages = JSON.parse(localStorage.getItem('unread_counts') || '{}');

function getUnreadCount(user) {
    return unreadMessages[user] || 0;
}

function incrementUnread(user) {
    if (currentChatTarget === user) return; // Don't count if we are already looking at the chat
    
    unreadMessages[user] = (unreadMessages[user] || 0) + 1;
    localStorage.setItem('unread_counts', JSON.stringify(unreadMessages));
    
    // Refresh the list to show the badge
    // (Or just update the specific badge element if you want to be fancy)
    const badge = document.getElementById(`badge-${user}`);
    if (badge) {
        badge.innerText = unreadMessages[user];
        badge.style.display = 'flex';
    }
}

function clearUnread(user) {
    unreadMessages[user] = 0;
    localStorage.setItem('unread_counts', JSON.stringify(unreadMessages));
    
    const badge = document.getElementById(`badge-${user}`);
    if (badge) {
        badge.style.display = 'none';
    }
}

// Check for saved theme on page load
document.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme');
    const icon = document.getElementById('theme-icon');
    
    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        if(icon) { 
            icon.className = 'fas fa-sun';
            icon.style.color = '#fff'; // Sun is white
        }
    } else {
        if(icon) {
            icon.className = 'fas fa-moon';
            icon.style.color = '#f1c40f'; // Half-moon is yellow
        }
    }
});

function toggleNightMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    const icon = document.getElementById('theme-icon');
    
    if (isDark) {
        // Switch to Dark Mode: Icon becomes a White Sun
        icon.className = 'fas fa-sun';
        icon.style.color = '#fff'; 
        localStorage.setItem('theme', 'dark');
    } else {
        // Switch to Light Mode: Icon becomes a Yellow Moon
        icon.className = 'fas fa-moon';
        icon.style.color = '#f1c40f'; 
        localStorage.setItem('theme', 'light');
    }
}

function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('active');
    overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
}

function toggleUserList() {
    const convList = document.querySelector('.conv-list');
    const overlay = document.getElementById('sidebar-overlay');
    convList.classList.toggle('show-mobile');
    overlay.style.display = convList.classList.contains('show-mobile') ? 'block' : 'none';
}

// Add this new helper function
function closeAllMenus() {
    document.querySelector('.sidebar').classList.remove('active');
    document.querySelector('.conv-list').classList.remove('show-mobile');
    document.getElementById('sidebar-overlay').style.display = 'none';
}

function switchChat(target) {
    currentChatTarget = target;
    clearUnread(target);
    document.getElementById("chat-title").innerText = (target === "Global") ? "Global Chat Room" : "Chat with " + target;
    document.getElementById("chat-box").innerHTML = ""; 
    
    // This ensures the menu closes automatically after you pick a chat
    closeAllMenus();

    socket.send(JSON.stringify({ type: "load_history", target: target }));
}
