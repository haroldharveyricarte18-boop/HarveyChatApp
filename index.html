<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarveyChatApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: #2c343f;
            --active-blue: #5d68e2;
            --bg-light: #f4f7fe;
            --text-gray: #8e94a9;
            --border-color: #e0e0e0;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg-light); overflow: hidden; }
        
        /* Main Sidebar */
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; font-weight: bold; letter-spacing: 1px; border-bottom: 1px solid #3d4654; }
        
        .user-profile { padding: 20px; display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; background: #555; }
        .user-info strong { display: block; font-size: 14px; }
        .user-info small { color: var(--text-gray); font-size: 12px; }
        
        .menu-item { padding: 12px 25px; color: var(--text-gray); cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .menu-item:hover { color: white; }
        .menu-item.active { background: var(--active-blue); color: white; border-radius: 0 20px 20px 0; margin-right: 20px; }

        /* Chat Layout Container */
        .chat-container { flex: 1; display: grid; grid-template-columns: 350px 1fr; background: white; }
        
        /* Conversation List (Left Panel) */
        .conv-list { border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .conv-header { padding: 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .active-user-item { padding: 15px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9f9f9; }
        .active-user-item:hover { background: #f0f4ff; }
        .active-user-item img { width: 35px; height: 35px; border-radius: 50%; }

        /* Main Chat Area (Right Panel) */
        .main-chat { 
    display: flex; 
    flex-direction: column; 
    background: white; 
    height: 100vh; /* Keeps the chat at full screen height */
    overflow: hidden; 
}
        .chat-header { padding: 15px 25px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        
        .messages { 
    flex: 1; 
    padding: 20px; 
    overflow-y: auto; /* Enables scrolling for messages only */
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
    background: #fafbfc; 
    scroll-behavior: smooth; 
}
        .message { max-width: 65%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; }
        .msg-received { background: var(--active-blue); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-sent { background: #e9ecef; color: #333; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-author { font-size: 10px; margin-bottom: 4px; display: block; opacity: 0.8; }

        .input-area { 
    padding: 20px; 
    border-top: 1px solid var(--border-color); 
    display: flex; 
    gap: 10px; 
    background: white; 
    flex-shrink: 0; /* Prevents the input bar from being squeezed out */
}
        input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--active-blue); }
        .send-btn { background: var(--active-blue); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .msg-time {
    display: block;
    font-size: 10px;
    margin-top: 4px;
    color: inherit; 
    opacity: 0.7;
}

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    #menu-toggle { display: block !important; } /* Show hamburger on mobile */

    .sidebar {
        position: fixed;
        left: -260px; /* Hide sidebar off-screen */
        top: 0;
        height: 100%;
        z-index: 1000;
        transition: 0.3s;
    }

    .sidebar.active { left: 0; } /* Slide sidebar in when active */

    .chat-container {
        grid-template-columns: 1fr; /* Stack layout: hide conversation list */
    }

    .conv-list {
        display: none; /* Hide the user list panel on mobile to save space */
    }
    
    .message { max-width: 85%; } /* Make message bubbles wider on small screens */
}

/* Emoji Picker styling */
.emoji-picker {
    display: none;
    position: absolute;
    bottom: 80px;
    left: 20px;
    background: white;
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    z-index: 1000;
}
.emoji-picker span { cursor: pointer; font-size: 20px; transition: 0.2s; }
.emoji-picker span:hover { transform: scale(1.2); }

/* Image message styling */
.chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<div id="sidebar-overlay" onclick="toggleSidebar()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>
<body>
    <audio id="sendSound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>
<audio id="receiveSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>
<audio id="deleteSound" src="https://assets.mixkit.co/active_storage/sfx/2360/2360-preview.mp3"></audio>

    <div class="sidebar">
        <div class="sidebar-header">HarveyChatApp</div>
        <div class="user-profile">
            <img id="myAvatar" src="" alt="profile">
            <div class="user-info">
                <strong id="myName">Loading...</strong>
                <small id="myRole">Web Developer</small>
            </div>
        </div>
        <div class="menu-item"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="menu-item active"><i class="fas fa-comment-dots"></i> Conversations</div>
        <div class="menu-item"><i class="fas fa-folder"></i> Projects</div>
        <div class="menu-item"><i class="fas fa-calendar-alt"></i> Schedule</div>
        
        <div style="margin-top: auto;" class="menu-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Log Out</div>
    </div>

    <div class="chat-container">
        <div class="conv-list">
            <div class="conv-header">
                <span>All Conversations</span>
                <button style="background:none; border:none; color:var(--active-blue); cursor:pointer;"><i class="fas fa-plus-circle"></i></button>
            </div>
            <div id="user-list">
                <div class="active-user-item">
                    <img src="https://ui-avatars.com/api/?name=Global+Chat&background=5d68e2&color=fff" alt="">
                    <div><strong>Global Group</strong><br><small style="color:var(--text-gray)">Active now</small></div>
                </div>
            </div>
        </div>
        
       <div class="main-chat">
    <div class="chat-header">
    <div style="display: flex; align-items: center; gap: 15px;">
        <i class="fas fa-bars" id="menu-toggle" style="cursor: pointer; font-size: 20px; display: none;" onclick="toggleSidebar()"></i>
        <strong id="chat-title">Global Chat Room</strong>
    </div>
        <div style="color: var(--text-gray); font-size: 18px;">
            <i class="fas fa-video" style="margin-right:15px; cursor:pointer;"></i>
            <i class="fas fa-phone" style="margin-right:15px; cursor:pointer;"></i>
            <i class="fas fa-ellipsis-v" style="cursor:pointer;"></i>
        </div>
    </div>

    <div id="chat-box" class="messages">
        </div>
        <div id="typing-indicator" style="font-size: 11px; color: #8e94a9; padding: 5px 25px; height: 20px; font-style: italic;"></div>

    <div class="input-area" style="position: relative;">
    <div id="emoji-picker" class="emoji-picker">
        <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('😂')">😂</span>
        <span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('👍')">👍</span>
        <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('😮')">😮</span>
        <span onclick="addEmoji('😢')">😢</span><span onclick="addEmoji('🎉')">🎉</span>
    </div>

    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="sendImage(this)">
    <button onclick="document.getElementById('imageInput').click()" style="background:none; border:none; color:var(--text-gray); font-size:20px; cursor:pointer;">
        <i class="fas fa-image"></i>
    </button>
    
    <button onclick="toggleEmojiPicker()" style="background:none; border:none; font-size:20px; cursor:pointer;">😊</button>

    <input type="text" id="msgInput" placeholder="Write a message..." onkeypress="handleKey(event)">
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>
</div>

    <script>
       function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('active');
    overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
} 

function toggleEmojiPicker() {
    const picker = document.getElementById('emoji-picker');
    picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
}

function addEmoji(emoji) {
    const input = document.getElementById('msgInput');
    input.value += emoji;
    input.focus();
    toggleEmojiPicker();
}

function sendImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const messageData = {
                type: "message",
                target: currentChatTarget,
                body: e.target.result, // The Base64 string
                is_image: true 
            };
            socket.send(JSON.stringify(messageData));
        };
        reader.readAsDataURL(input.files[0]);
        input.value = ""; // Reset input
    }
}

        let currentChatTarget = "Global"; // Default to the main room

        const getCookie = (name) => {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return "Guest";
        }

        const currentUsername = getCookie("username");

// If no username is found, or it's "Guest", redirect to login immediately
if (!currentUsername || currentUsername === "Guest") {
    window.location.href = "/";
}

document.getElementById("myName").innerText = currentUsername;
document.getElementById("myAvatar").src = `https://ui-avatars.com/api/?name=${currentUsername}&background=random`;

        // 2. WEBSOCKET LOGIC
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
let socket = new WebSocket(protocol + window.location.host + "/ws");

    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        const chatBox = document.getElementById("chat-box");
        const typingDiv = document.getElementById("typing-indicator");

        if (data.type === "users") {
            updateUserList(data.list);
        } 
        // 1. Handle Typing Indicator
        else if (data.type === "typing" && data.user !== currentUsername) {
            typingDiv.innerText = `${data.user} is typing...`;
        } 
        else if (data.type === "stop_typing") {
            typingDiv.innerText = "";
        }
        // 2. Handle Deletion (Added sound here)
        else if (data.type === "message_deleted") {
            const el = document.querySelector(`[data-id="${data.id}"]`);
            if (el) {
                document.getElementById("deleteSound").play(); // Play sound
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 300);
            }
        } 
        // 3. Handle Messages (Added sound and read receipts)
        else if (data.type === "message") {
            const isGlobal = data.target === "Global" || !data.target;
            const isRelevant = (isGlobal && currentChatTarget === "Global") || 
                               (data.user === currentChatTarget && data.target === currentUsername) || 
                               (data.user === currentUsername && data.target === currentChatTarget);

            if (isRelevant) {
                let msgDiv = document.createElement("div");
                const isMe = data.user === currentUsername;
                
                // Play receive sound if it's not from me
                if (!isMe) document.getElementById("receiveSound").play();

                msgDiv.setAttribute("data-id", data.id);
                msgDiv.className = isMe ? "message msg-sent" : "message msg-received";
                
                const deleteBtn = isMe ? 
                    `<i class="fas fa-trash-alt" style="cursor:pointer; margin-left:8px; color:#ff4d4d; font-size:12px;" onclick="confirmDelete(${data.id})"></i>` : '';

                // ADDED: Read Receipt Checkmark (Double check)
                const checkMark = isMe ? `<i class="fas fa-check-double" style="margin-left:5px; color:#5d68e2;"></i>` : '';

                msgDiv.innerHTML = `
                    <span class="msg-author">${isMe ? "You" : data.user}</span>
                    ${data.is_image ? 
                        `<img src="${data.body}" class="chat-img" onclick="window.open(this.src)">` : 
                        `<div class="msg-body">${data.body}</div>`
                    }
                    <div style="display: flex; justify-content: flex-end; align-items: center; font-size: 10px; opacity: 0.6; margin-top: 4px;">
                        ${data.time}
                        ${checkMark}
                        ${deleteBtn}
                    </div>
                `;

                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    };

        function updateUserList(users) {
    const listDiv = document.getElementById("user-list");
    listDiv.innerHTML = "";
    
    // Always add the Global Group first
    const globalItem = document.createElement("div");
    globalItem.className = "active-user-item";
    globalItem.innerHTML = `<strong>Global Chat Room</strong>`;
    globalItem.onclick = () => switchChat("Global");
    listDiv.appendChild(globalItem);

    users.forEach(user => {
        if (user === currentUsername) return; // Don't chat with yourself
        const userItem = document.createElement("div");
        userItem.className = "active-user-item";
        userItem.innerHTML = `
            <img src="https://ui-avatars.com/api/?name=${user}&background=random" alt="">
            <div><strong>${user}</strong><br><small style="color:#28a745">Online</small></div>
        `;
        userItem.onclick = () => switchChat(user);
        listDiv.appendChild(userItem);
    });
}

function switchChat(target) {
            currentChatTarget = target;
            document.getElementById("chat-title").innerText = (target === "Global") ? "Global Chat Room" : "Chat with " + target;
            document.getElementById("chat-box").innerHTML = ""; 
            
            // Highlight the active user in the list
            document.querySelectorAll('.active-user-item').forEach(el => el.classList.remove('active-chat'));
            
            // Ask server for specific history
            socket.send(JSON.stringify({ type: "load_history", target: target }));
        }

       function sendMessage() {
    let input = document.getElementById("msgInput");
    if(input.value.trim() !== "") {
        // Play the "Send" sound effect immediately
        document.getElementById("sendSound").play(); 

        const messageData = {
            type: "message",
            target: currentChatTarget, // This sends it to the person you clicked
            body: input.value
        };
        socket.send(JSON.stringify(messageData));
        input.value = "";
        
        // Also send a "stop_typing" signal immediately after sending
        socket.send(JSON.stringify({ 
            type: "stop_typing", 
            user: currentUsername, 
            target: currentChatTarget 
        }));
    }
}

// Typing Indicator Logic
    let typingTimeout;
    document.getElementById("msgInput").addEventListener("input", () => {
        // Send typing signal to server
        socket.send(JSON.stringify({ 
            type: "typing", 
            user: currentUsername, 
            target: currentChatTarget 
        }));
        
        // Stop the "typing" status after 2 seconds of no input
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.send(JSON.stringify({ 
                type: "stop_typing", 
                user: currentUsername, 
                target: currentChatTarget 
            }));
        }, 2000);
    });

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function logout() {
    // 1. Kill the cookie for the whole site
    document.cookie = "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    
    // 2. Clear session storage just in case
    sessionStorage.clear();
    localStorage.clear();

    // 3. Force a hard redirect to the home page
    // Using window.location.replace is better because it doesn't keep the dashboard in history
    window.location.replace("/"); 
}

       // --- Helper function to send delete request to Go server ---
function confirmDelete(messageId) {
    if (confirm("Permanently delete this message?")) {
        socket.send(JSON.stringify({
            type: "delete_message",
            id: parseInt(messageId)
        }));
    }
}
    </script>
</body>
</html>
